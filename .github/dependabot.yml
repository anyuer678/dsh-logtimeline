version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # coverage-v8 5 强制新配置 coverageFilesDirectory（CI 实证 AssertionError），需 vitest 配置改造。
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
