name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 不因历史噪声阻断所有 PR：可先 continue-on-error，再收紧
        continue-on-error: true
      - name: Pattern sanity
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          pat = re.compile(r"sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY")
          skip = {".git","node_modules","dist","build",".next"}
          hits = []
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(x in p.parts for x in skip):
                  continue
              if p.suffix.lower() in {".png",".jpg",".jpeg",".gif",".woff",".map",".lock"}:
                  continue
              try:
                  if p.stat().st_size > 2_000_000: continue
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for i,line in enumerate(text.splitlines(),1):
                  if pat.search(line) and not any(x in line.lower() for x in ("your-","example","placeholder","sk-your","test")):
                      hits.append(f"{p}:{i}")
          if hits:
              print("SUSPICIOUS")
              print("\n".join(hits[:50]))
              sys.exit(1)
          print("pattern sanity ok")
          PY
