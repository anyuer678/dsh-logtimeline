name: secret-scan

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  # 硬门禁：高置信密钥模式必须干净
  pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pattern sanity (HARD GATE)
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          pat = re.compile(
              r"sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|"
              r"github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY"
          )
          skip = {".git","node_modules","dist","build",".next","__pycache__"}
          hits = []
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(x in p.parts for x in skip):
                  continue
              if p.suffix.lower() in {".png",".jpg",".jpeg",".gif",".woff",".map",".lock",".ico",".webp"}:
                  continue
              try:
                  if p.stat().st_size > 2_000_000:
                      continue
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  low = line.lower()
                  if any(x in low for x in ("your-", "your_", "example", "placeholder", "sk-your", "xxx", "todo", "replace-with")):
                      continue
                  if pat.search(line):
                      hits.append(f"{p}:{i}:{line.strip()[:120]}")
          if hits:
              print("SUSPICIOUS")
              print("\n".join(hits[:50]))
              sys.exit(1)
          print("pattern sanity ok")
          print("HARD GATE: pattern-scan job must pass")
          PY

  # 可选：Gitleaks 全量扫描（历史噪声可能失败，不阻断 pattern 硬门禁）
  gitleaks-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 可选收紧：设置仓库变量 GITLEAKS_STRICT=true 后，gitleaks 失败会阻断
  gitleaks-strict:
    runs-on: ubuntu-latest
    if: ${{ vars.GITLEAKS_STRICT == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (strict)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
