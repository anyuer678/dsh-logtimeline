name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # host.test.ts loads lib/index.js — build before vitest
      - name: Build
        run: npm run build
      - name: Unit tests + coverage floor
        run: npm run test:only -- --coverage
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
