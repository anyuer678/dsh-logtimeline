# Bundle patch applied over the selected DSH profile when this package is listed
# in `dsh.profile.bundles`. The row id is deployment-local; the package name
# must match package.json.

- insert:
    - id: logtimeline
      name: 'dsh-logtimeline'

    # DSH packages own an invariant companion; keep this row when the selected
    # base profile provides the `invariants` service.
    - id: logtimeline-invariant
      name: 'dsh-logtimeline/invariant'
